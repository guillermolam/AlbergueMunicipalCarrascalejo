# Runtime configuration for Cloudflare Workers services
# This file defines KV namespaces and their purposes

[kv_namespaces]

[kv_namespaces.cache]
binding = "CACHE"
description = "KV namespace for general caching (location data, reviews, etc.)"

[kv_namespaces.rate_limit]
binding = "RATE_LIMIT"
description = "KV namespace for rate limiting counters and client tracking"

[kv_namespaces.security]
binding = "SECURITY"
description = "KV namespace for security tokens and session data"