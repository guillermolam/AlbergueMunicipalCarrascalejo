name: Nightly Release Pipeline

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  check-dependabot:
    name: Check Dependabot PRs
    runs-on: ubuntu-latest
    outputs:
      pr_count: ${{ steps.count.outputs.count }}
    steps:
      - name: Get Dependabot PRs
        id: count
        run: |
          count=$(gh pr list --state open --label "dependencies" --json number --jq 'length')
          echo "count=$count" >> $GITHUB_OUTPUT

  validate:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    needs: check-dependabot
    if: needs.check-dependabot.outputs.pr_count > 0
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build

      - name: Type check
        run: |
          cd frontend
          pnpm run type-check

  auto-merge:
    name: Auto-Merge Dependabot PRs
    runs-on: ubuntu-latest
    needs: [validate]
    if: needs.validate.outputs.conclusion == 'success'
    steps:
      - name: Auto-merge PRs
        run: |
          for pr in $(gh pr list --state open --label "dependencies" --json number --jq '.[].number'); do
            echo "Merging PR #$pr"
            gh pr merge $pr --auto --squash || echo "Could not merge PR #$pr"
          done

  nightly-release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    needs: [check-dependabot, auto-merge]
    if: needs.check-dependabot.outputs.pr_count > 0 && needs.auto-merge.outputs.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Determine version
        id: version
        run: |
          DATE=$(date +%Y%m%d)
          HOUR=$(date +%H%M)
          VERSION="nightly-$DATE-$HOUR"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Nightly Release ${{ steps.version.outputs.version }}
          body: |
            ## Nightly Release
            Built from latest main branch including dependency updates.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-fermyon:
    name: Deploy to Fermyon
    runs-on: ubuntu-latest
    needs: nightly-release
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build

      - name: Setup Spin
        run: |
          curl -fsSL https://developer.fermyon.com/downloads/install.sh | bash
          echo "$HOME/.spin/bin" >> $GITHUB_PATH

      - name: Deploy to Fermyon
        run: |
          echo "${{ secrets.FERMYON_CLOUD_TOKEN }}" | spin cloud login --token
          spin cloud deploy --link kv:default=default
        env:
          FERMYON_CLOUD_TOKEN: ${{ secrets.FERMYON_CLOUD_TOKEN }}

  deploy-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: nightly-release
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build

      - name: Deploy to Cloudflare
        run: |
          cd frontend
          pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '798e36259a38e6217cc9987ce0bf1316' }}
