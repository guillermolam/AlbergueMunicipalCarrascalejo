name = "info-on-arrival-service"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
command = "PATH=$HOME/.cargo/bin:$PATH worker-build --release"

[vars]
ENVIRONMENT = "production"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "albergue-bookings"
database_id = "local_dev_stub" # Set after `wrangler d1 create albergue-bookings`

[placement]
mode = "smart"