version: "3"

vars:
  GITHUB_REPO: "guillermolam/AlbergueMunicipalCarrascalejo"
  GITHUB_PAGES_URL:
    sh: echo "https://guillermolam.github.io/AlbergueMunicipalCarrascalejo"
  FERMYON_APP_NAME: "albergue-carrascalejo"

tasks:
  status:
    desc: Show deployment status
    cmds:
      - |
        echo "📊 Deployment Status"
        echo "===================="
        echo ""
        
        echo "GitHub Pages:"
        echo "   URL: https://guillermolam.github.io/AlbergueMunicipalCarrascalejo"
        echo "   Status: Check at https://github.com/$GITHUB_REPO/actions"
        
        echo ""
        echo "Fermyon Cloud:"
        spin cloud apps info $FERMYON_APP_NAME 2>/dev/null || echo "   ❌ Not found"

  deploy:github:
    desc: Trigger GitHub Pages deployment (push to main)
    cmds:
      - |
        echo "🚀 GitHub Pages deployment triggered by pushing to main"
        echo "   Push to main branch to trigger deployment"
        echo "   Workflow: .github/workflows/deploy.yml"
        echo ""
        echo "   URL will be: https://guillermolam.github.io/AlbergueMunicipalCarrascalejo"

  test:github:
    desc: Test GitHub Pages deployment
    cmds:
      - |
        echo "🧪 Testing GitHub Pages deployment..."
        
        # Test the main URL
        echo "   Testing: https://guillermolam.github.io/AlbergueMunicipalCarrascalejo"
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://guillermolam.github.io/AlbergueMunicipalCarrascalejo" 2>/dev/null || echo "000")
        echo "   Status: HTTP $STATUS"
        
        if [ "$STATUS" = "200" ]; then
          echo "✅ GitHub Pages is responding"
        else
          echo "❌ GitHub Pages not responding (HTTP $STATUS)"
          echo "   The deployment may still be in progress"
          echo "   Check: https://github.com/$GITHUB_REPO/actions"
        fi

  test:all:
    desc: Test all deployments
    cmds:
      - task test:github
      
      - echo ""
      - echo "Fermyon Cloud:"
      - curl -s -o /dev/null -w "   API: HTTP %{http_code}\n" --max-time 10 "https://albergue-carrascalejo-v99ew1nt.fermyon.app/api/" 2>/dev/null || echo "   API: Failed"
