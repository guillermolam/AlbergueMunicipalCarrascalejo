spin_manifest_version = 2

[application]
name = "albergue-carrascalejo"
version = "1.0.0"
description = "Albergue Municipal Carrascalejo - Frontend Only"

[[trigger.http]]
route = "/..."
component = "frontend"

[component.frontend]
source = "spin:fileserver"
files = [{ source = "frontend/dist", destination = "/" }]

[component.frontend.build]
command = "cd frontend && pnpm install && pnpm build"