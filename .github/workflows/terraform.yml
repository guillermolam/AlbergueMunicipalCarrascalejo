name: Terraform

on:
  push:
    branches: [main]
    paths: [infra/**]
  pull_request:
    branches: [main]
    paths: [infra/**]
  schedule:
    # Drift detection: daily at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - drift-detect

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

env:
  TF_CLOUD_ORGANIZATION: albergue-elcarrascalejo
  TF_WORKSPACE: AlbergueMunicipalCarrascalejo
  TF_IN_AUTOMATION: true

jobs:
  # ===========================================================================
  # Job 1: Format & Lint
  # ===========================================================================
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

  # ===========================================================================
  # Job 2: Security Scanning (Checkov + KICS)
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true
          skip_check: CKV_TF_1,CKV_GIT_1

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov

      - name: KICS Scan
        uses: Checkmarx/kics-github-action@v2
        with:
          path: infra/
          output_path: kics-results/
          output_formats: json,sarif
          fail_on: high
          enable_comments: true
          type: Terraform

      - name: Upload KICS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kics-results/results.sarif
          category: kics

  # ===========================================================================
  # Job 3: Terraform Plan
  # ===========================================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### Terraform Plan Results

            | Step | Status |
            |------|--------|
            | Init | \`${process.env.INIT_OUTCOME}\` |
            | Plan | \`${process.env.PLAN_OUTCOME}\` |

            <details><summary>Show Plan Output</summary>

            \`\`\`terraform
            ${process.env.PLAN_OUTPUT}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ===========================================================================
  # Job 4: Terraform Apply (main branch only)
  # ===========================================================================
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [lint]
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment: Production
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  # ===========================================================================
  # Job 5: Drift Detection (scheduled + manual)
  # ===========================================================================
  drift-detect:
    name: Drift Detection
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'drift-detect')
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Detect Drift
        id: drift
        run: |
          terraform plan -no-color -input=false -detailed-exitcode -out=drift.tfplan 2>&1 | tee plan_output.txt
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected!"
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected."
          else
            echo "drift_detected=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        continue-on-error: true

      - name: Create Drift Issue
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        env:
          DRIFT_OUTPUT: ${{ steps.drift.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'infrastructure-drift'
            });

            const driftIssue = existingIssues.data.find(i => i.title.includes('Infrastructure Drift Detected'));

            const body = `Terraform detected configuration drift at ${new Date().toISOString()}.

            <details><summary>Drift Details</summary>

            \`\`\`
            ${process.env.DRIFT_OUTPUT || 'See workflow run for details'}
            \`\`\`

            </details>

            **Action required**: Review and run \`terraform apply\` or update configuration.`;

            if (driftIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: driftIssue.number,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Infrastructure Drift Detected',
                body: body,
                labels: ['infrastructure-drift', 'automated']
              });
            }
