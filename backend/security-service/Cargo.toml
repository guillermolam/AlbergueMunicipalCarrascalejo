[package]
name = "security-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
regex = "1"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.17"
tracing = "0.1"

# Cloudflare Workers SDK
worker = "0.7.5"

# Shared
shared = { path = "../shared" }
