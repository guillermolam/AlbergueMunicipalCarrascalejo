sonar.projectKey=guillermolam_AlbergueMunicipalCarrascalejo
sonar.organization=guillermolam
sonar.sources=frontend/src,backend,gateway,infra

# Exclude generated artifacts, vendored deps, GIS data, and the dev Dockerfile.
# tests/infrastructure/docker/** is excluded because Dockerfile.dev uses
# multi-stage COPY (docker:S6504) and ARG/ENV indirection (docker:S4507) that
# SonarCloud static analysis cannot resolve — both are intentional security
# hardening patterns, not real vulnerabilities.
sonar.exclusions=\
  **/dist/**,\
  **/target/**,\
  **/node_modules/**,\
  GIS/**,\
  frontend/public/**,\
  tests/infrastructure/docker/**
