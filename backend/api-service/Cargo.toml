# Standalone CF Worker — opts out of the backend/ workspace
[workspace]

[package]
name = "albergue-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cloudflare Workers SDK — 0.7 re-exports wasm-bindgen; no separate dep needed
worker = { version = "0.7", features = ["d1", "queue"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# UUID (js feature for WASM-compatible RNG)
uuid = { version = "1.0", features = ["v4", "serde", "js"] }

# Security scanning
regex = "1"
base64 = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
