name = "albergue-api"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
command = "cargo install worker-build && worker-build --release"

[vars]
ENVIRONMENT = "production"

# D1 Database (replaces Turso + Neon)
[[d1_databases]]
binding = "DB"
database_name = "albergue-bookings"
database_id = "" # Set after `wrangler d1 create albergue-bookings`

# KV Namespace (replaces Redis Cloud)
[[kv_namespaces]]
binding = "CACHE"
id = "" # Set after `wrangler kv namespace create CACHE`

# KV for rate limiting state
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "" # Set after `wrangler kv namespace create RATE_LIMIT`

# Queue for async event processing (replaces HiveMQ MQTT)
[[queues.producers]]
queue = "booking-events"
binding = "BOOKING_EVENTS"

[[queues.consumers]]
queue = "booking-events"
max_batch_size = 10
max_batch_timeout = 30

[placement]
mode = "smart"
