[package]
name = "rate-limiter-service"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.env]
RATE_LIMIT_REQUESTS = { default = "100", description = "Requests per minute limit" }
RATE_LIMIT_WINDOW_SECS = { default = "60", description = "Rate limit window in seconds" }
RATE_LIMIT_BURST = { default = "20", description = "Burst allowance" }
LOG_LEVEL = { default = "info", description = "Application log level" }

[dependencies]
spin-sdk = "5.1.1"
http = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
serde_json = "1.0"

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "rate_limit_algorithm_tests"
path = "tests/rate_limit_algorithm_tests.rs"

[[test]]
name = "edge_case_tests"
path = "tests/edge_case_tests.rs"

[[test]]
name = "performance_tests"
path = "tests/performance_tests.rs"
