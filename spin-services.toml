spin_manifest_version = 2

[application]
name = "albergue-gateway"
version = "1.0.0"
description = "Albergue Gateway + Services Only"

[variables]
gateway_config_path = { default = "/config/gateway.toml" }
database_url = { required = true }
neon_database_url = { required = true }
log_level = { default = "info" }
redis_url = { required = true }
redis_address = { required = true }
booking_timeout_hours = { default = "2" }
encryption_key = { required = true }

[[trigger.http]]
route = "/api/..."
component = "gateway"

[[trigger.http]]
route = { private = true }
component = "mqtt-broker-service"

[component.gateway]
source = "gateway/target/wasm32-wasip2/release/api_gateway.wasm"
allowed_outbound_hosts = [
  "https://accounts.google.com",
  "https://www.googleapis.com",
  "https://oauth2.googleapis.com",
  "https://openidconnect.googleapis.com",
  "redis://*",
]
key_value_stores = ["default"]
files = [{ source = "gateway/api-gateway/config", destination = "/config" }]

[component.gateway.variables]
gateway_config_path = "{{ gateway_config_path }}"
redis_address = "{{ redis_address }}"

[component.auth-service]
source = "backend/target/wasm32-wasip2/release/auth.wasm"
allowed_outbound_hosts = ["https://*.logto.app", "https://*.zitadel.cloud"]

[component.booking-service]
source = "backend/target/wasm32-wasip2/release/booking_service.wasm"
allowed_outbound_hosts = ["https://*.neon.tech", "https://*.postgres.com"]
key_value_stores = ["default"]
sqlite_databases = ["default"]

[component.booking-service.variables]
database_url = "{{ database_url }}"
neon_database_url = "{{ neon_database_url }}"
booking_timeout_hours = "{{ booking_timeout_hours }}"
log_level = "{{ log_level }}"

[component.notification-service]
source = "backend/target/wasm32-wasip2/release/notification_service.wasm"
key_value_stores = ["default"]

[component.notification-service.variables]
database_url = "{{ database_url }}"
neon_database_url = "{{ neon_database_url }}"
log_level = "{{ log_level }}"

[component.redis-service]
source = "backend/target/wasm32-wasip2/release/redis_service.wasm"
allowed_outbound_hosts = ["redis://*"]
key_value_stores = ["default"]

[component.redis-service.variables]
redis_url = "{{ redis_url }}"

[component.reviews-service]
source = "backend/target/wasm32-wasip2/release/reviews_service.wasm"
allowed_outbound_hosts = ["https://*.neon.tech", "https://*.postgres.com"]
sqlite_databases = ["default"]

[component.reviews-service.variables]
database_url = "{{ database_url }}"
neon_database_url = "{{ neon_database_url }}"
log_level = "{{ log_level }}"

[component.mqtt-broker-service]
source = "backend/target/wasm32-wasip2/release/mqtt_broker.wasm"
allowed_outbound_hosts = ["mqtt://4daf0d9c7c5f4112a62ec2f01b94518d.s1.eu.hivemq.cloud:8883"]
key_value_stores = ["default"]