[package]
name = "auth"
authors = ["Guillermo Lam <guillermolam.m@gmail.com>"]
description = "OIDC and OAuth2 Service"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
openidconnect = "4.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cloudflare Workers SDK
worker = "0.7.5"
bytes = "1"
serde_urlencoded = "0.7"
http = "1.0"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", features = ["json"] }
ring = "0.17"
rsa = "0.9"
ed25519-dalek = "2.0"
jsonwebtoken = { version = "10", features = ["use_pem", "rust_crypto"] }
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
