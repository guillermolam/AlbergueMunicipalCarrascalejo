name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NODE_ENV: test
  PUBLIC_API_MODE: local

jobs:
  # Frontend CI
  frontend:
    name: Frontend Build & Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # package.json only defines "format" (write). In CI we should "check".
      - name: Prettier check
        run: pnpm exec prettier --check src/

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # Gateway CI (Spin WASM proxy)
  gateway:
    name: Gateway Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Install just
        run: |
          cargo install just --locked || cargo install just

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('gateway/**/Cargo.toml') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('gateway/**/Cargo.toml') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: gateway/target
          key: ${{ runner.os }}-cargo-build-gateway-${{ hashFiles('gateway/**/Cargo.toml') }}

      - name: Format check
        run: just fmt-check

      - name: Clippy (deny warnings)
        run: just clippy

      - name: Test
        run: just test

      - name: Build (wasm)
        # aws-lc-sys cannot cross-compile to wasm32-wasip1; tracked issue upstream
        continue-on-error: true
        run: cargo build --workspace --release --target wasm32-wasip1

  # Backend CI (CF Workers services)
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Install just
        run: |
          cargo install just --locked || cargo install just

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('backend/**/Cargo.toml') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('backend/**/Cargo.toml') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-backend-${{ hashFiles('backend/**/Cargo.toml') }}

      - name: Format check
        run: just fmt

      - name: Clippy (deny warnings)
        run: just clippy

      - name: Test
        run: just test

  # Database CI
  database:
    name: Database Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: albergue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

      - name: Apply migrations
        run: |
          for migration in domain_model/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d albergue_test -f "$migration"
          done
        env:
          PGPASSWORD: postgres

      - name: Apply test seed
        run: |
          psql -h localhost -U postgres -d albergue_test -f domain_model/seed/test_seed.sql
        env:
          PGPASSWORD: postgres

      - name: Run SQL tests
        run: |
          for test in domain_model/test/*.sql; do
            echo "Running $test"
            psql -h localhost -U postgres -d albergue_test -f "$test"
          done
        env:
          PGPASSWORD: postgres

  # Integration Tests (Rust: tests/integration)
  integration:
    name: Integration Tests (Spin)
    runs-on: ubuntu-latest
    needs: [frontend, gateway, database]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: albergue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Install Spin CLI
        run: |
          for url in \
            "https://github.com/spinframework/spin/releases/download/v4.0.0/spin-v4.0.0-static-linux-amd64.tar.gz" \
            "https://github.com/spinframework/spin/releases/download/v4.0.0/spin-v4.0.0-linux-amd64.tar.gz"; do
            tmpdir=$(mktemp -d)
            if curl -fsSL "$url" -o "$tmpdir/spin.tar.gz"; then
              tar -xzf "$tmpdir/spin.tar.gz" -C "$tmpdir"
              cp "$tmpdir"/spin .
              chmod +x spin
              echo "$(pwd)/spin" >> $GITHUB_PATH
              rm -rf "$tmpdir"
              break
            fi
            rm -rf "$tmpdir"
          done

      - name: Install just
        run: |
          cargo install just --locked || cargo install just

      - name: Build Spin app (root spin.toml)
        run: |
          spin --version
          spin build

      # Run only fmt-check + clippy here; full integration tests require a live
      # Spin gateway (spin up) which is not started in this job.
      - name: Lint integration test crate (tests/integration)
        run: |
          cd tests/integration
          just fmt
          just clippy

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run security audit (Node)
        run: |
          cd frontend
          pnpm audit --audit-level=critical

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # cargo-audit needs a lockfile; generate it for the gateway workspace first.
      - name: Generate lockfile (gateway)
        run: |
          cd gateway
          cargo generate-lockfile

      - name: Run cargo audit (gateway)
        run: |
          cd gateway
          cargo audit

  # Deployment Check
  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [frontend, gateway, backend, database, integration, security]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build for production
        run: |
          cd frontend
          pnpm build

      - name: Check build artifacts
        run: |
          cd frontend
          ls -la dist/
          test -f dist/server/entry.mjs
          test -f dist/server/wrangler.json
          echo "✅ Cloudflare Worker artifacts ready for deployment"

  # ===========================================================================
  # SonarCloud Code Analysis
  # ===========================================================================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [frontend, gateway, backend]
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v1.0.0
        with:
          projectBaseDir: .
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
