name = "document-validation-service"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
# Pre-build: PATH=$HOME/.cargo/bin:$PATH worker-build --release
command = "PATH=$HOME/.cargo/bin:$PATH worker-build --release"

[vars]
ENVIRONMENT = "development"

# D1 and KV bindings are only needed when the service stores processed results.
# The image validation endpoint is stateless — no D1/KV required for local dev.
# Uncomment and fill in the IDs when deploying to Cloudflare production:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "albergue-bookings"
# database_id = "YOUR_D1_ID_HERE"
#
# [[kv_namespaces]]
# binding = "CACHE"
# id = "YOUR_KV_ID_HERE"
