name = "location-service"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
command = "cargo install worker-build && worker-build --release"

[vars]
ENVIRONMENT = "production"
# Geoapify API key — override in .dev.vars for local dev,
# set via `wrangler secret put GEOAPIFY_API_KEY` for production.
GEOAPIFY_API_KEY = ""

# KV for caching
[[kv_namespaces]]
binding = "CACHE"
id = "" # Set after `wrangler kv namespace create CACHE`

[placement]
mode = "smart"