name               = "albergue-api"
main               = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
command = "export PATH=$HOME/.cargo/bin:$PATH && worker-build --release"

[vars]
ENVIRONMENT = "development"

# D1 Database — placeholder UUID lets wrangler dev use a local SQLite file.
# Replace with the real ID after: wrangler d1 create albergue-bookings
[[d1_databases]]
binding       = "DB"
database_name = "albergue-bookings"
database_id   = "541bcbf5-059b-485d-8f96-690c22b6bc0f"

# KV Namespace — placeholder IDs for local dev (wrangler creates in-memory store).
# Replace with real IDs after: wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id      = "00000000000000000000000000000001"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id      = "00000000000000000000000000000002"

# Queues are not supported in local wrangler dev — commented out.
# Uncomment for production deployment.
# [[queues.producers]]
# queue   = "booking-events"
# binding = "BOOKING_EVENTS"
#
# [[queues.consumers]]
# queue             = "booking-events"
# max_batch_size    = 10
# max_batch_timeout = 30
