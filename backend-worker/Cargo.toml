[package]
name = "albergue-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cloudflare Workers SDK
worker = "0.5"
worker-macros = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# UUID (js feature for WASM-compatible RNG)
uuid = { version = "1.0", features = ["v4", "serde", "js"] }

# Security scanning
regex = "1"
base64 = "0.22"

# JWT validation deferred - jsonwebtoken depends on ring which needs native C for WASM
# Use CF Workers built-in JWT validation or pure-Rust alternatives

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# JS interop
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
