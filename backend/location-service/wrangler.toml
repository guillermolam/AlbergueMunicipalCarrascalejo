name = "location-service"
main = "build/worker/shim.mjs"
compatibility_date = "2024-12-01"

[build]
command = "PATH=$HOME/.cargo/bin:$PATH worker-build --release"

[vars]
ENVIRONMENT = "production"
# Geoapify API key — override in .dev.vars for local dev,
# set via `wrangler secret put GEOAPIFY_API_KEY` for production.
GEOAPIFY_API_KEY = ""

# KV for caching
[[kv_namespaces]]
binding = "CACHE"
id = "local_dev_stub" # Set after `wrangler kv namespace create CACHE`

[placement]
mode = "smart"