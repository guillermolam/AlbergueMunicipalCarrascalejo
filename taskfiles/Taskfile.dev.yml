version: "3"

# Development tasks for the Albergue Municipal Carrascalejo project
# All backend services are Cloudflare Workers — use `wrangler dev` for local dev.
# Each service runs on its own port (see .ports.json / comments below).
#
# Ports:
#   8787  document-validation-service  (DOC_VALIDATION_URL)
#   8788  ocr-service
#   8789  booking-service
#   8790  location-service
#   8791  reviews-service
#   8792  info-on-arrival-service
#   8793  notification-service
#   4321  frontend (Astro SSR via Node adapter in dev)

vars:
  FRONTEND_PORT: 4321
  DOC_VALIDATION_PORT: 8787
  OCR_PORT: 8788
  BOOKING_PORT: 8789
  LOCATION_PORT: 8790
  REVIEWS_PORT: 8791
  INFO_PORT: 8792
  NOTIFICATION_PORT: 8793

tasks:
  default:
    desc: Show available development tasks
    cmds:
      - task --list-all

  # ── Main dev task ──────────────────────────────────────────────────────────
  run-all:
    desc: Build WASM artifacts then start all services
    cmds:
      - task: build-wasm
      - task: start

  # ── Build WASM for all Cloudflare Worker services ─────────────────────────
  build-wasm:
    desc: Compile all backend services to WASM (worker-build --release)
    cmds:
      - task: build-document-validation
      - task: build-booking
      - task: build-location
      - task: build-reviews
      - task: build-info
      - task: build-notification
      - task: build-ocr

  build-document-validation:
    desc: Build document-validation-service WASM
    dir: backend/document-validation-service
    cmds:
      - PATH=$HOME/.cargo/bin:$PATH worker-build --release

  build-booking:
    desc: Build booking-service WASM
    dir: backend/booking-service
    cmds:
      - PATH=$HOME/.cargo/bin:$PATH worker-build --release

  build-location:
    desc: Build location-service WASM
    dir: backend/location-service
    cmds:
      - PATH=$HOME/.cargo/bin:$PATH worker-build --release

  build-reviews:
    desc: Build reviews-service WASM
    dir: backend/reviews-service
    cmds:
      - PATH=$HOME/.cargo/bin:$PATH worker-build --release

  build-info:
    desc: Build info-on-arrival-service WASM
    dir: backend/info-on-arrival-service
    cmds:
      - PATH=$HOME/.cargo/bin:$PATH worker-build --release

  build-notification:
    desc: Build notification-service WASM
    dir: backend/notification-service
    cmds:
      - PATH=$HOME/.cargo/bin:$PATH worker-build --release

  build-ocr:
    desc: Build ocr-service WASM
    dir: backend/ocr-service
    cmds:
      - PATH=$HOME/.cargo/bin:$PATH worker-build --release

  # ── Start all services ─────────────────────────────────────────────────────
  start:
    desc: Start all Cloudflare Worker services + frontend in parallel
    cmds:
      - |
        (cd backend/document-validation-service && wrangler dev --port {{.DOC_VALIDATION_PORT}} --local 2>&1 | sed 's/^/[doc-validation] /') &
        (cd backend/booking-service            && wrangler dev --port {{.BOOKING_PORT}}          --local 2>&1 | sed 's/^/[booking] /') &
        (cd backend/location-service           && wrangler dev --port {{.LOCATION_PORT}}         --local 2>&1 | sed 's/^/[location] /') &
        (cd backend/reviews-service            && wrangler dev --port {{.REVIEWS_PORT}}          --local 2>&1 | sed 's/^/[reviews] /') &
        (cd backend/info-on-arrival-service    && wrangler dev --port {{.INFO_PORT}}             --local 2>&1 | sed 's/^/[info] /') &
        (cd backend/notification-service       && wrangler dev --port {{.NOTIFICATION_PORT}}     --local 2>&1 | sed 's/^/[notification] /') &
        (cd frontend                           && pnpm dev 2>&1 | sed 's/^/[frontend] /') &
        wait

  # ── Start individual services ──────────────────────────────────────────────
  document-validation:
    desc: Start document-validation-service on port 8787
    dir: backend/document-validation-service
    cmds:
      - wrangler dev --port {{.DOC_VALIDATION_PORT}} --local

  booking:
    desc: Start booking-service on port 8789
    dir: backend/booking-service
    cmds:
      - wrangler dev --port {{.BOOKING_PORT}} --local

  location:
    desc: Start location-service on port 8790
    dir: backend/location-service
    cmds:
      - wrangler dev --port {{.LOCATION_PORT}} --local

  reviews:
    desc: Start reviews-service on port 8791
    dir: backend/reviews-service
    cmds:
      - wrangler dev --port {{.REVIEWS_PORT}} --local

  info:
    desc: Start info-on-arrival-service on port 8792
    dir: backend/info-on-arrival-service
    cmds:
      - wrangler dev --port {{.INFO_PORT}} --local

  notification:
    desc: Start notification-service on port 8793
    dir: backend/notification-service
    cmds:
      - wrangler dev --port {{.NOTIFICATION_PORT}} --local

  frontend:
    desc: Start Astro frontend on port 4321
    dir: frontend
    cmds:
      - pnpm dev

  # ── Stop all services ──────────────────────────────────────────────────────
  stop:
    desc: Stop all development services
    cmds:
      - pkill -f 'wrangler dev' || true
      - pkill -f 'pnpm dev' || true
      - pkill -f 'astro dev' || true
      - echo "✅ All dev services stopped"

  restart:
    desc: Restart all development services
    cmds:
      - task: stop
      - task: start

  status:
    desc: Show running dev services
    cmds:
      - ps aux | grep -E 'wrangler dev|pnpm dev|astro dev' | grep -v grep || echo "No services running"

  clean:
    desc: Stop services and clean build artifacts
    cmds:
      - task: stop
      - rm -rf backend/*/build
      - echo "✅ Build artifacts cleaned"

  setup:
    desc: Install tools needed for development
    cmds:
      - cargo install worker-build --locked || true
      - cd frontend && pnpm install
      - echo "✅ Dev setup complete"
