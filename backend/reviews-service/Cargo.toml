[package]
name = "reviews-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"

# Cloudflare Workers SDK
worker = { version = "0.7.5", features = ["d1"] }
url = "2"

# Shared
shared = { path = "../shared" }
